
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Weather App</h1>
            <p>Check the weather in your city</p>
        </header>

        <!-- Search Section -->
        <form id="search-form" class="search-box">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                autocomplete="off"
            >
            <button type="submit">Search</button>
        </form>

        <!-- Error Message -->
        <p id="error-message" class="error"></p>

        <!-- Loading Message -->
        <p id="loading-message" class="loading"></p>

        <!-- Weather Information -->
        <main id="weather-card" class="weather-card hidden">

            <div class="location">
                <h2 id="city-name">Jakarta</h2>
                <p id="country-name">Indonesia</p>
            </div>

            <div class="weather-main">
                <div id="weather-icon" class="weather-icon">☀️</div>
                <h1 id="temperature">30°C</h1>
                <p id="weather-condition">Clear Sky</p>
            </div>

            <div class="weather-details">

                <div class="detail-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">65%</h3>
                </div>

                <div class="detail-box">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="wind-speed">12 km/h</h3>
                </div>

            </div>

        </main>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
